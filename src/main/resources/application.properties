# ============================================================
# 本地任务队列运行时配置（无需任何外部消息服务）
# ============================================================
# 后端类型：memory = 纯内存（默认，进程结束状态消失）；
#           file   = 本地可恢复后端（消息/位点/死信原子落盘，重启恢复）
queue.backend=memory
# file 后端的数据目录（仅在 queue.backend=file 时生效）
queue.data-dir=./target/queue-data
spring.application.name=task-queue-runtime-java
